name: Verify / provision CyraCode database
description: >-
  Connects to the Azure PostgreSQL database with psycopg2, optionally applies
  database/schema.postgres.sql to a NEW/EMPTY database, and verifies expected
  tables exist. Optionally opens a temporary firewall rule for the GitHub
  runner's public IP while the check runs and removes it afterwards.
  This action NEVER drops, truncates, or recreates existing data.

inputs:
  mode:
    description: "connect (SELECT 1 only) or check (assert all expected tables exist)"
    required: false
    default: connect
  database_url:
    description: >-
      psycopg2-style PostgreSQL URL, e.g.
      postgresql+psycopg2://user:pass@host:5432/db?sslmode=require.
      Passed as a secret - never log it.
    required: true
  provision_schema:
    description: >-
      Repo-relative path to the schema file to apply. Only runs against a NEW
      or EMPTY database and refuses if any expected table already exists.
      Empty string skips provisioning.
    required: false
    default: ""
  manage_firewall:
    description: "true to add + remove a temporary firewall rule for the runner IP."
    required: false
    default: "false"
  resource_group:
    description: "Azure resource group (needed when manage_firewall is true)."
    required: false
    default: ""
  postgres_server:
    description: "Azure PostgreSQL flexible server name (needed when manage_firewall is true)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Python and psycopg2
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install psycopg2
      shell: bash
      run: python -m pip install --quiet psycopg2-binary

    - name: Run database verification
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database_url }}
        MODE: ${{ inputs.mode }}
        SCHEMA_FILE: ${{ inputs.provision_schema }}
        MANAGE_FIREWALL: ${{ inputs.manage_firewall }}
        RESOURCE_GROUP: ${{ inputs.resource_group }}
        POSTGRES_SERVER: ${{ inputs.postgres_server }}
      run: |
        set -euo pipefail

        # Optionally open a temporary firewall rule for the throwaway runner IP.
        RULE_NAME=""
        if [[ "${MANAGE_FIREWALL}" == "true" ]]; then
          if [[ -z "${RESOURCE_GROUP}" || -z "${POSTGRES_SERVER}" ]]; then
            echo "::error::db-verify: DB_MANAGE_FIREWALL is true but AZURE_RESOURCE_GROUP/AZURE_POSTGRES_SERVER are not set."
            exit 1
          fi
          RUNNER_IP="$(curl -fsS https://api.ipify.org || true)"
          if [[ -z "${RUNNER_IP}" ]]; then
            echo "::error::db-verify: could not determine runner public IP."
            exit 1
          fi
          RULE_NAME="gh-actions-$$-$(date +%s)"
          az postgres flexible-server firewall-rule create \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${POSTGRES_SERVER}" \
            --rule-name "${RULE_NAME}" \
            --start-ip-address "${RUNNER_IP}" \
            --end-ip-address "${RUNNER_IP}" >/dev/null
          echo "Added temporary firewall rule '${RULE_NAME}' for ${RUNNER_IP}"
          cleanup() {
            az postgres flexible-server firewall-rule delete \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${POSTGRES_SERVER}" \
              --rule-name "${RULE_NAME}" --yes >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
        fi

        ARGS=(--mode "${MODE}")
        if [[ -n "${SCHEMA_FILE}" ]]; then
          ARGS+=(--provision "${SCHEMA_FILE}")
        fi
        python backend/scripts/ci_verify_db.py "${ARGS[@]}"