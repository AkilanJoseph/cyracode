name: CyraCode CI/CD - Deploy to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cyracode-azure-${{ github.ref }}
  cancel-in-progress: false

env:
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://cyracode-api.azurewebsites.net' }}
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://cyracode-frontend.azurewebsites.net' }}
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  API_APP_NAME: ${{ vars.AZURE_API_APP_NAME || 'cyracode-api' }}
  FRONTEND_APP_NAME: ${{ vars.AZURE_FRONTEND_APP_NAME || 'cyracode-frontend' }}

jobs:

  # ============================================================
  # 1. BACKEND BUILD & TEST
  # ============================================================
  build-be:
    name: Backend tests & package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        run: |
          python -m pytest -q

      - name: Create backend deployment package
        run: |
          set -euo pipefail

          rm -rf /tmp/be
          mkdir -p /tmp/be

          tar \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='tests' \
            --exclude='.venv' \
            -cf /tmp/be-src.tar .

          tar -xf /tmp/be-src.tar -C /tmp/be

          cd /tmp/be
          zip -qr /tmp/backend-package.zip .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-package
          path: /tmp/backend-package.zip
          if-no-files-found: error


  # ============================================================
  # 2. FRONTEND BUILD & TEST
  # ============================================================
  build-fe:
    name: Frontend tests & package
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run frontend tests
        run: |
          npm run test

      - name: Build frontend
        run: |
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://cyracode-api.azurewebsites.net' }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || '1052815738416-5i78kc963p2fimgnkvadv05pmj2640p3.apps.googleusercontent.com' }}

      - name: Create frontend deployment package
        run: |
          set -euo pipefail

          rm -rf /tmp/fe
          mkdir -p /tmp/fe

          cp -r dist server.js package.json /tmp/fe/

          cd /tmp/fe
          zip -qr /tmp/frontend-package.zip .

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package
          path: /tmp/frontend-package.zip
          if-no-files-found: error


  # ============================================================
  # 3. BACKEND DEPLOYMENT
  # ============================================================
  deploy-be:
    name: Deploy API to Azure App Service

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'

    needs: build-be

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-package
          path: ./

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set backend startup command
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$API_APP_NAME" \
            --startup-file "uvicorn app.main:app --host 0.0.0.0 --port 8000"
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          API_APP_NAME: ${{ env.API_APP_NAME }}

      - name: Deploy API package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: ./backend-package.zip


  # ============================================================
  # 4. FRONTEND DEPLOYMENT
  # ============================================================
  deploy-fe:
    name: Deploy frontend to Azure App Service

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'

    needs: build-fe

    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-package
          path: ./

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set frontend startup command
        run: |
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP_NAME" \
            --startup-file "node server.js"
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          FRONTEND_APP_NAME: ${{ env.FRONTEND_APP_NAME }}

      - name: Configure frontend App Service
        run: |
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$FRONTEND_APP_NAME" \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=0 \
              WEBSITE_NODE_DEFAULT_VERSION=20
        env:
          RESOURCE_GROUP: ${{ env.RESOURCE_GROUP }}
          FRONTEND_APP_NAME: ${{ env.FRONTEND_APP_NAME }}

      - name: Deploy frontend package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.FRONTEND_APP_NAME }}
          package: ./frontend-package.zip


  # ============================================================
  # 5. POST DEPLOYMENT VERIFICATION
  # ============================================================
  verify:
    name: Post-deploy verification

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'

    needs:
      - deploy-be
      - deploy-fe

    runs-on: ubuntu-latest
    environment: production

    steps:

      - name: Wait for API health endpoint
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do

            if curl -fsS \
              --max-time 10 \
              "$API_URL/health" | grep -q '"status":"ok"'; then

              echo "API is healthy: $API_URL/health"
              exit 0

            fi

            echo "Waiting for API ($i/30)..."
            sleep 10

          done

          echo "::error::API did not become healthy at $API_URL/health"
          exit 1

        env:
          API_URL: ${{ env.API_BASE_URL }}


      - name: Verify database round-trip through API
        run: |
          set -euo pipefail

          body="$(curl -fsS \
            --max-time 20 \
            "$API_URL/registration/count")"

          echo "$body" | grep -q 'display_count'

          echo "API -> database connectivity OK"

        env:
          API_URL: ${{ env.API_BASE_URL }}


      - name: Wait for frontend
        run: |
          set -euo pipefail

          for i in $(seq 1 20); do

            if curl -fsS \
              -o /dev/null \
              --max-time 10 \
              "$FRONTEND_URL/"; then

              echo "Frontend is up: $FRONTEND_URL"
              exit 0

            fi

            echo "Waiting for frontend ($i/20)..."
            sleep 10

          done

          echo "::error::Frontend did not become reachable at $FRONTEND_URL"
          exit 1

        env:
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
